  <title>SMS Shield 4.0</title>

    (function () {
      const p = window.location.pathname || "/";
      const target = p.startsWith("/nlp/") || p === "/nlp" ? "/nlp/" : "/";
      window.location.replace(target);
    })();
  </script>
</head>
